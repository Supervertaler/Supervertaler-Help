<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 220">
  <!-- EverTM octopus, draft 1: flat, Supervertaler purple (#5B21B6 -> #7C3AED), teal language tags. -->
  <defs>
    <linearGradient id="body" x1="0%" y1="0%" x2="70%" y2="100%">
      <stop offset="0%" stop-color="#8B5CF6"/>
      <stop offset="100%" stop-color="#5B21B6"/>
    </linearGradient>
    <linearGradient id="arm" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#7C3AED"/>
      <stop offset="100%" stop-color="#6D28D9"/>
    </linearGradient>
  </defs>

  <!-- arms: left three, then the same mirrored -->
  <g fill="none" stroke="url(#arm)" stroke-width="15" stroke-linecap="round">
    <g id="arms">
      <path d="M88 128 C62 128 42 116 34 96 C28 80 36 66 50 70"/>
      <path d="M96 140 C80 156 58 166 44 180 C34 192 44 204 56 196"/>
      <path d="M110 146 C108 166 104 182 98 194 C92 206 80 202 84 192"/>
    </g>
    <use href="#arms" transform="translate(240 0) scale(-1 1)"/>
  </g>
  <!-- suckers on the curled tips -->
  <g fill="#C4B5FD" opacity="0.9">
    <circle cx="44" cy="86" r="2.6"/><circle cx="50" cy="194" r="2.6"/><circle cx="90" cy="198" r="2.6"/>
    <circle cx="196" cy="86" r="2.6"/><circle cx="190" cy="194" r="2.6"/><circle cx="150" cy="198" r="2.6"/>
  </g>

  <!-- head -->
  <path d="M120 22 C162 22 184 54 184 92 C184 126 160 150 120 150 C80 150 56 126 56 92 C56 54 78 22 120 22 Z" fill="url(#body)"/>
  <ellipse cx="100" cy="48" rx="16" ry="9" fill="#ffffff" opacity="0.18" transform="rotate(-25 100 48)"/>

  <!-- face -->
  <g>
    <ellipse cx="100" cy="94" rx="13" ry="14" fill="#ffffff"/>
    <ellipse cx="140" cy="94" rx="13" ry="14" fill="#ffffff"/>
    <circle cx="103" cy="97" r="7.5" fill="#1E1B4B"/>
    <circle cx="143" cy="97" r="7.5" fill="#1E1B4B"/>
    <circle cx="106" cy="93" r="2.6" fill="#ffffff"/>
    <circle cx="146" cy="93" r="2.6" fill="#ffffff"/>
    <ellipse cx="84" cy="116" rx="8" ry="5" fill="#F0ABFC" opacity="0.55"/>
    <ellipse cx="156" cy="116" rx="8" ry="5" fill="#F0ABFC" opacity="0.55"/>
    <path d="M110 118 Q120 128 130 118" fill="none" stroke="#1E1B4B" stroke-width="3.5" stroke-linecap="round"/>
  </g>

  <!-- language tags held by the top arms -->
  <g font-family="Segoe UI, Arial, sans-serif" font-weight="700" font-size="15" text-anchor="middle">
    <rect x="22" y="38" width="38" height="26" rx="7" fill="#0D9488"/>
    <text x="41" y="56.5" fill="#ffffff">NL</text>
    <rect x="180" y="38" width="38" height="26" rx="7" fill="#0D9488"/>
    <text x="199" y="56.5" fill="#ffffff">EN</text>
  </g>
  <!-- two-way arrow between the tags, over the head -->
  <g fill="none" stroke="#0D9488" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
    <path d="M70 16 Q120 -2 170 16"/>
    <path d="M162 9 L170 16 L160 20"/>
    <path d="M78 9 L70 16 L80 20"/>
  </g>
</svg>
