<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="EverTM purple octopus holding NL and EN tags under a two-way arrow">
  <defs>
    <linearGradient id="body" x2=".18" y2="1">
      <stop stop-color="#8B5CF6"/>
      <stop offset=".48" stop-color="#7C3AED"/>
      <stop offset="1" stop-color="#5B21B6"/>
    </linearGradient>
  </defs>

  <!-- Arms: four curled tips on each side -->
  <g fill="none" stroke="url(#body)" stroke-linecap="round">
    <path stroke-width="32" d="M164 285 C104 294 59 244 73 201 C80 180 101 177 105 191 M348 285 C408 294 453 244 439 201 C432 180 411 177 407 191"/>
    <path stroke-width="27" d="M186 302 C149 323 89 373 79 412 C73 438 106 438 104 417 M326 302 C363 323 423 373 433 412 C439 438 406 438 408 417"/>
    <path stroke-width="23" d="M205 309 C201 342 192 371 173 377 M307 309 C311 342 320 371 339 377"/>
    <path stroke-width="35" d="M231 313 C225 362 218 409 196 436 C183 451 168 439 181 425 M281 313 C287 362 294 409 316 436 C329 451 344 439 331 425"/>
  </g>
  <g fill="#C4A0F5">
    <circle cx="105" cy="191" r="6"/><circle cx="407" cy="191" r="6"/>
    <circle cx="104" cy="417" r="6"/><circle cx="408" cy="417" r="6"/>
    <circle cx="173" cy="377" r="5"/><circle cx="339" cy="377" r="5"/>
    <circle cx="181" cy="425" r="6"/><circle cx="331" cy="425" r="6"/>
  </g>

  <!-- Head and highlight -->
  <circle cx="256" cy="210" r="122" fill="url(#body)"/>
  <ellipse cx="216" cy="139" rx="37" ry="17" transform="rotate(-27 216 139)" fill="#C4A0F5" opacity=".47"/>

  <!-- Face -->
  <g fill="#FFFFFF">
    <circle cx="215" cy="222" r="27"/><circle cx="297" cy="222" r="27"/>
  </g>
  <g fill="#1E1B4B">
    <circle cx="221" cy="227" r="15"/><circle cx="303" cy="227" r="15"/>
  </g>
  <g fill="#FFFFFF">
    <circle cx="228" cy="217" r="5"/><circle cx="310" cy="217" r="5"/>
  </g>
  <g fill="#E49ADB" opacity=".82">
    <ellipse cx="186" cy="263" rx="16" ry="10"/><ellipse cx="326" cy="263" rx="16" ry="10"/>
  </g>
  <path d="M237 266 Q256 286 275 266" fill="none" stroke="#1E1B4B" stroke-width="7" stroke-linecap="round"/>

  <!-- Language tags -->
  <g fill="#0D9488">
    <rect x="46" y="119" width="90" height="58" rx="15"/>
    <rect x="376" y="119" width="90" height="58" rx="15"/>
  </g>
  <g fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="35" font-weight="bold" text-anchor="middle">
    <text x="91" y="161">NL</text>
    <text x="421" y="161">EN</text>
  </g>

  <!-- Two-way arrow -->
  <g fill="none" stroke="#0D9488" stroke-width="8" stroke-linecap="round" stroke-linejoin="round">
    <path d="M148 79 Q256 26 364 79"/>
    <path d="M162 59 L148 79 L171 83 M350 59 L364 79 L341 83"/>
  </g>
</svg>
